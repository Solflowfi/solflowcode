[package]
name = "solflow-staging"
version = "0.1.0"
description = "SOLFLOW MAINNET STAGING program ($TST staging deployment - separate keypair/ID from the production program; NOT AUDITED)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solflow_staging"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[scripts]
# build via: anchor build  (staging deploy only, with the operator's own review)
